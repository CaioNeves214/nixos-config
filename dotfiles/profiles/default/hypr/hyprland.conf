# =========================
# MONITORS
# =========================
monitor=,preferred,auto,1

# =========================
# COLORS (design system — gerado por wallust)
# =========================
source = ~/.config/hypr/colors.conf

# =========================
# CURSOR
# =========================
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24

# =========================
# PROGRAMS
# =========================
$terminal = kitty
$fileManager = thunar
$menu = walker

# =========================
# AUTOSTART
# =========================
exec-once = waybar
exec-once = hyprpaper
exec-once = quickshell
exec-once = udiskie --tray

# Histórico de clipboard (cliphist) — texto e imagens
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# =========================
# INPUT
# =========================
input {
    kb_layout = br
    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }

    sensitivity = 0
}

input {
    touchpad {
        clickfinger_behavior = true
        natural_scroll = true
        tap-to-click = true
        scroll_factor = 0.5
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 10
    workspace_swipe_cancel_ratio = 0.15
}

# =========================
# GENERAL
# =========================
general {
    gaps_in = 4
    gaps_out = 8

    border_size = 2

    col.active_border = $primary
    col.inactive_border = $base

    resize_on_border = false
}

# =========================
# DECORATION
# =========================
decoration {
    rounding = 10

    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

# =========================
# ANIMATIONS
# =========================
animations {
    enabled = true

    bezier = workspaceBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 4, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 7, default, slidefade
    animation = workspacesIn, 1, 7, default, slidefade
    animation = workspacesOut, 1, 7, default, slidefade
}

# =========================
# LAYOUT
# =========================
dwindle {
    preserve_split = true
}

# =========================
# KEYBINDS
# =========================
bind = SUPER, Return, exec, $terminal
bind = SUPER, E, exec, $fileManager
bind = SUPER, D, exec, $menu
bind = SUPER, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = SUPER, Q, exec, $terminal

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bind = SUPER, C, killactive
bind = SUPER, F, fullscreen

bind = SUPER, left, movefocus, l
bind = SUPER, down, movefocus, d
bind = SUPER, up, movefocus, u
bind = SUPER, right, movefocus, r

bind = SUPER SHIFT, left, movetoworkspace, r-1
bind = SUPER SHIFT, right, movetoworkspace, r+1

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER,W,exec,wallpaper-picker

# Histórico de clipboard (estilo Win+V) — lista via rofi, já temado pelo design system
bind = SUPER, V, exec, clipboard-picker

# Screenshot de área selecionada -> área de transferência (colar com Ctrl+V)
bind = SUPER SHIFT, S, exec, screenshot-clipboard

# Brilho (teclas de função do MacBook via fn) — piso de 5% para nunca apagar a tela
bindel = , XF86MonBrightnessUp, exec, brightness-ctl inc 5
bindel = , XF86MonBrightnessDown, exec, brightness-ctl dec 5

# Volume (F10 mute, F11 diminuir, F12 aumentar) — teto de 100% para não distorcer o áudio
bindel = , XF86AudioMute, exec, volume-ctl mute
bindel = , XF86AudioLowerVolume, exec, volume-ctl dec 5
bindel = , XF86AudioRaiseVolume, exec, volume-ctl inc 5

# Mídia — falam com o widget Quickshell por IPC (`qs ipc call media <fn>`), que
# já tem o player MPRIS resolvido; um playerctl paralelo poderia escolher outro.
# bindl: continuam valendo com a tela bloqueada.
bindl = , XF86AudioPlay, exec, qs ipc call media playPause
bindl = , XF86AudioNext, exec, qs ipc call media next
bindl = , XF86AudioPrev, exec, qs ipc call media previous
# Abre/fecha o card sem precisar do mouse (fica travado aberto até apertar de novo)
bind = SUPER SHIFT, M, exec, qs ipc call media toggle

# =========================
# WINDOW RULES
# =========================

# Volume popup (waybar pulseaudio on-click)
# Positioned just below the waybar: margin-top(8) + height(42) + gap(8) = 58px from top
# 72% from left places it near the right-side modules
windowrulev2 = float, class:waybar-volume-popup
windowrulev2 = move 72% 58, class:waybar-volume-popup
windowrulev2 = size 290 70, class:waybar-volume-popup
windowrulev2 = noborder, class:waybar-volume-popup
windowrulev2 = pin, class:waybar-volume-popup

# Widget de mídia Quickshell (layer-shell sob a waybar): borrão no card
# drop-down, combinando com o blur já ativo nas janelas (ver decoration acima).
layerrule = blur, quickshell-media
layerrule = ignorezero, quickshell-media

# Editor de conexões de rede (nm-connection-editor, "Conexões de rede" /
# "configurações avançadas de rede" do nm-applet): sem essa regra o dwindle
# tiling espreme a janela na metade do espaço disponível (ex.: 624x728 ao
# lado de outra janela), escondendo as abas de configuração e os botões
# Adicionar/Remover/Editar. Forçado a float com tamanho fixo e centralizado.
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = size 900 600, class:^(nm-connection-editor)$
windowrulev2 = center, class:^(nm-connection-editor)$

# Thunar (gerenciador de arquivos): mesmo problema — o dwindle espreme a
# janela pela metade ao lado de outra (testado: 624x728), cortando sidebar,
# pathbar e botões da toolbar. Diferente do nm-connection-editor, testei
# "minsize" como alternativa (manter tiling mas impor um piso de largura) e
# o dwindle simplesmente ignora minsize em janelas tiled — só float resolve
# de fato. Forçado a float sempre, com tamanho fixo e centralizado; perde o
# tiling automático, mas pode ser arrastado manualmente lado a lado se quiser.
windowrulev2 = float, class:^(thunar)$
windowrulev2 = size 1100 700, class:^(thunar)$
windowrulev2 = center, class:^(thunar)$
