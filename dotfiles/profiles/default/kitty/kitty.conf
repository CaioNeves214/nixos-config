# Cores do design system (geradas por wallust em ~/.config/kitty/colors.conf).
# Caminho ABSOLUTO: este arquivo é incluído a partir de ~/.config/theme/active/,
# e o kitty resolve include relativo contra o diretório do arquivo que inclui.
include /home/caio/.config/kitty/colors.conf

# Fonte explícita: sem isto o kitty cai no "monospace" do fontconfig, e instalar
# uma fonte nova (ex. ibm-plex) mudaria a fonte deste perfil sem querer.
font_family JetBrainsMono Nerd Font

background_opacity 0.75

# Zoom (aumentar/diminuir fonte).
# kitty já mapeia ctrl+shift+equal/plus/minus/backspace para isso por padrão (nomes de tecla
# do kitty são baseados na tecla física do layout US), mas deixamos explícito aqui + um atalho
# de reserva em ctrl+shift+a/d (letras, que não mudam de posição no layout br/ABNT2) para o caso
# de os símbolos +/- não baterem certo no teclado do MacBook com kb_layout=br.
map ctrl+shift+equal      change_font_size all +2.0
map ctrl+shift+plus       change_font_size all +2.0
map ctrl+shift+minus      change_font_size all -2.0
map ctrl+shift+underscore change_font_size all -2.0
map ctrl+shift+backspace  change_font_size all 0

map ctrl+shift+a change_font_size all +2.0
map ctrl+shift+d change_font_size all -2.0
